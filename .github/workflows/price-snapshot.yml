name: Price Snapshot (Mitra10)

on:
  schedule:
    - cron: "0 22 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Scrape Mitra10 prices
        run: bun run scrape:prices

      - name: Commit snapshot
        run: |
          git config user.name "biaya-bangun[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-snapshots/
          git add -f data/biaya-bangun.sqlite
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan harga, lewati commit."
            exit 0
          fi
          git commit -m "chore: snapshot harga Mitra10 $(date +%Y-%m-%d)"
          git push
